<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RefFlow research graph</title><link rel="stylesheet" href="assets/index.css"><script src="assets/index.js" defer></script></head>
<body><header><strong>REFFLOW <span>Research graph</span></strong><nav aria-label="Graph controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="reset">Fit view</button></nav></header>
<main><svg id="graph" viewBox="0 0 1000 600" role="group" aria-label="Research similarity graph"></svg><p id="empty" role="status"></p></main>
<footer><p id="status" role="status" aria-live="polite"></p><p id="detail"></p><small>Links indicate research similarity. Red nodes are in your Zotero library.</small></footer></body></html>
