<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox id="zotero-prefpane-__addonRef__" class="refflow-preferences">
  <html:header class="refflow-pref-header">
    <html:div class="refflow-pref-brand">
      <html:h1>__addonName__</html:h1>
      <html:p class="refflow-pref-version">v__buildVersion__</html:p>
    </html:div>
  </html:header>
  <html:details class="refflow-setting-group" aria-labelledby="refflow-online-title" open="open">
    <html:summary><html:span id="refflow-online-title" data-l10n-id="caption-online"></html:span></html:summary>
    <html:div class="refflow-setting-group-body">
    <html:label data-l10n-id="openAlexKey-label" for="__addonRef__-openalex-key"></html:label>
    <html:input type="password" id="__addonRef__-openalex-key" preference="extensions.zotero.__addonRef__.openAlexKey" autocomplete="off" />
    <html:p data-l10n-id="openAlexKey-description"></html:p>
    <html:a href="https://openalex.org/settings/api" data-l10n-id="openAlexKey-get"></html:a>
    <html:label data-l10n-id="semanticScholarKey-label" for="__addonRef__-semanticscholar-key"></html:label>
    <html:input type="password" id="__addonRef__-semanticscholar-key" preference="extensions.zotero.__addonRef__.semanticScholarKey" autocomplete="off" />
    <html:p data-l10n-id="semanticScholarKey-description"></html:p>
    <html:a href="https://www.semanticscholar.org/product/api#api-key-form" data-l10n-id="semanticScholarKey-get"></html:a>
    </html:div>
  </html:details>
  <html:details class="refflow-setting-group" aria-labelledby="refflow-retrieval-title">
    <html:summary><html:span id="refflow-retrieval-title" data-l10n-id="caption-refresh"></html:span></html:summary>
    <html:div class="refflow-setting-group-body">
    <html:div class="refflow-setting-subgroup">
    <checkbox native="true" id="__addonRef__-auto-refresh" data-l10n-id="autoRefresh"
      preference="extensions.zotero.__addonRef__.autoRefresh" />
    <html:div class="refflow-setting-input-row refflow-setting-input-row-wide">
      <html:input type="text" id="__addonRef__-not-auto-refresh-item-types"
        preference="extensions.zotero.__addonRef__.notAutoRefreshItemTypes">
      </html:input>
    </html:div>
    </html:div>
    <html:div class="refflow-setting-subgroup">
    <html:h3 data-l10n-id="caption-source"></html:h3>
    <html:div class="refflow-setting-input-row">
      <html:span data-l10n-id="prioritySource-start"></html:span>
      <menulist native="true" id="__addonRef__-priority-source"
        preference="extensions.zotero.__addonRef__.prioritySource">
        <menupopup>
          <menuitem value="Auto" data-l10n-id="source-auto"></menuitem>
          <menuitem value="Web" data-l10n-id="source-web"></menuitem>
          <menuitem value="PDF" label="PDF"></menuitem>
          <menuitem value="API" label="API"></menuitem>
        </menupopup>
      </menulist>
      <html:span data-l10n-id="prioritySource-end"></html:span>
    </html:div>
    </html:div>
    <html:div class="refflow-setting-subgroup">
    <html:h3 data-l10n-id="caption-tip"></html:h3>
    <hbox class="refflow-setting-input-row refflow-color-row">
      <html:span data-l10n-id="tipBackgroundColor"></html:span>
      <html:input type="text" id="__addonRef__-tip-background-color"
        preference="extensions.zotero.__addonRef__.tipBackgroundColor">
      </html:input>
      <html:span data-l10n-id="tipTitleColor"></html:span>
      <html:input type="text" id="__addonRef__-tip-title-color"
        preference="extensions.zotero.__addonRef__.tipTitleColor">
      </html:input>
    </hbox>
    <html:div class="refflow-setting-input-row refflow-tip-delay-row">
      <checkbox native="true" id="__addonRef__-is-show-tip" data-l10n-id="isShowTip-start"
        preference="extensions.zotero.__addonRef__.isShowTip"/>
      <html:input type="text"
        id="__addonRef__-show-tip-after-millisecond"
        preference="extensions.zotero.__addonRef__.showTipAfterMillisecond">
      </html:input>
      <html:span data-l10n-id="isShowTip-end"></html:span>
    </html:div>
    <checkbox native="true" id="__addonRef__-ctrl-click-translate" data-l10n-id="ctrlClickTranslate"
      preference="extensions.zotero.__addonRef__.ctrlClickTranslate" />
    <hbox class="refflow-setting-input-row refflow-setting-input-row-compact">
      <html:span data-l10n-id="shadeMillisecond-start"></html:span>
      <html:input type="text" id="__addonRef__-shade-millisecond"
        preference="extensions.zotero.__addonRef__.shadeMillisecond">
      </html:input>
      <html:span data-l10n-id="shadeMillisecond-end"></html:span>
    </hbox>
    <hbox class="refflow-setting-input-row refflow-setting-input-row-compact">
      <html:span data-l10n-id="removeTipAfterMillisecond-start"></html:span>
      <html:input type="text"
        id="__addonRef__-remove-tip-after-millisecond"
        preference="extensions.zotero.__addonRef__.removeTipAfterMillisecond">
      </html:input>
      <html:span data-l10n-id="removeTipAfterMillisecond-end">
      </html:span>
    </hbox>
    </html:div>
    <html:div class="refflow-setting-subgroup">
    <html:h3 data-l10n-id="caption-save"></html:h3>
    <checkbox native="true" id="__addonRef__-save-pdf-references" data-l10n-id="savePDFReferences"
      preference="extensions.zotero.__addonRef__.savePDFReferences" />
    <checkbox native="true" id="__addonRef__-save-api-references" data-l10n-id="saveAPIReferences"
      preference="extensions.zotero.__addonRef__.saveAPIReferences" />
    </html:div>
    <html:div class="refflow-setting-subgroup">
    <html:h3 data-l10n-id="caption-match"></html:h3>
    <hbox class="refflow-setting-input-row refflow-range-row">
      <html:span data-l10n-id="notInLibarayOpacity-start"></html:span>
      <html:input type="range" min="0" max="1" step="0.01" id="__addonRef__-not-in-library-opacity"
        preference="extensions.zotero.__addonRef__.notInLibarayOpacity">
      </html:input>
      <html:span data-l10n-id="notInLibarayOpacity-end"></html:span>
    </hbox>
    </html:div>
    </html:div>
  </html:details>
  <html:details class="refflow-setting-group" aria-labelledby="refflow-actions-title">
    <html:summary><html:span id="refflow-actions-title" data-l10n-id="caption-actions"></html:span></html:summary>
    <html:div class="refflow-setting-group-body">
      <checkbox native="true" id="__addonRef__-show-source-details" data-l10n-id="showSourceDetails" preference="extensions.zotero.__addonRef__.showSourceDetails" />
      <html:p data-l10n-id="actions-description"></html:p>
      <html:span id="__addonRef__-actions-working" data-l10n-id="actions-working" hidden="hidden"></html:span>
      <html:div class="refflow-setting-input-row refflow-action-buttons">
        <html:button type="button" data-refflow-action="copy-text" data-l10n-id="action-copy-text"></html:button>
        <html:button type="button" data-refflow-action="copy-doi" data-l10n-id="action-copy-doi"></html:button>
        <html:button type="button" data-refflow-action="copy-url" data-l10n-id="action-copy-url"></html:button>
        <html:button type="button" data-refflow-action="open" data-l10n-id="action-open"></html:button>
        <html:button type="button" data-refflow-action="import-selected" data-l10n-id="action-import-selected"></html:button>
        <html:button type="button" data-refflow-action="import-all" data-l10n-id="action-import-all"></html:button>
        <html:button type="button" data-refflow-action="rollback" data-l10n-id="action-rollback"></html:button>
      </html:div><html:p id="__addonRef__-actions-status" role="status" aria-live="polite"></html:p>
    </html:div>
  </html:details>
  <html:details class="refflow-setting-group" aria-labelledby="refflow-about-title">
    <html:summary><html:span id="refflow-about-title">关于 RefFlow</html:span></html:summary>
    <html:div class="refflow-setting-group-body">
    <html:div class="refflow-setting-subgroup" id="__addonRef__-about">
    <html:p data-l10n-id="about-maintainer"></html:p>
    <html:p data-l10n-id="about-origin"></html:p>
    <html:p data-l10n-id="about-updates"></html:p>
    <html:div class="refflow-about-links">
      <html:a id="__addonRef__-project-link" href="__homepage__" data-l10n-id="about-project"></html:a>
      <html:a id="__addonRef__-issues-link" href="__issuesURL__" data-l10n-id="about-issues"></html:a>
      <html:a href="__upstreamURL__" data-l10n-id="about-upstream"></html:a>
      <html:a id="__addonRef__-release-notes-link" href="__releaseNotesURL__" data-l10n-id="about-release-notes"></html:a>
    </html:div>
    </html:div>
    </html:div>
  </html:details>
  <html:footer class="refflow-pref-footer" aria-label="版本信息">
    <html:div class="refflow-footer-title">版本信息</html:div>
    <html:div><html:span class="refflow-footer-label">版本说明</html:span><html:span>设置面板风格统一；一级分组可折叠；版本信息独立列示</html:span></html:div>
    <html:div><html:span class="refflow-footer-label">构建日期</html:span><html:span>__buildTime__</html:span></html:div>
    <html:div><html:span class="refflow-footer-label">安装包</html:span><html:a href="https://github.com/groele/Zotero-RefFlow/releases/download/v__buildVersion__/zotero-refflow.xpi">下载 Zotero RefFlow v__buildVersion__ (.xpi)</html:a></html:div>
    <html:div><html:span class="refflow-footer-label">项目仓库</html:span><html:a href="https://github.com/groele/Zotero-RefFlow">groele/Zotero-RefFlow</html:a></html:div>
  </html:footer>
</vbox>
