<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="20" height="20" fill="none" role="img" aria-label="Zotero RefFlow">
  <title>Zotero RefFlow</title>
  <desc>Full-optical-scale airy wire-frame layered reference sheets with coral-orange extraction arrow for the Zotero item pane sidenav.</desc>
  <defs>
    <linearGradient id="rfSideBackStroke" x1="34" y1="10" x2="116" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="rfSideFrontStroke" x1="12" y1="30" x2="94" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="rfSideExtractArrow" x1="66" y1="72" x2="120" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Back Floating L-corner Page Stroke -->
  <path d="M 40 14 H 96 C 107 14, 113 20, 113 31 V 66" stroke="url(#rfSideBackStroke)" stroke-width="13" stroke-linecap="round" />

  <!-- Front Open Wire Page Frame -->
  <path d="M 58 112 H 29 C 19 112, 13 106, 13 96 V 48 C 13 38, 19 32, 29 32 H 78 C 88 32, 94 38, 94 48 V 61" stroke="url(#rfSideFrontStroke)" stroke-width="13" stroke-linecap="round" />

  <!-- Reference Lines inside Front Page -->
  <path d="M 35 60 H 68" stroke="#0EA5E9" stroke-width="12" stroke-linecap="round" />
  <path d="M 35 83 H 54" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />

  <!-- Sweeping Extraction Arrow breaking out of the corner -->
  <path d="M 70 95 H 114 M 96 76 L 116 95 L 96 114" stroke="url(#rfSideExtractArrow)" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
