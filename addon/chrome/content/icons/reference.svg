<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="16" height="16" fill="none" role="img" aria-label="Zotero RefFlow">
  <title>Zotero RefFlow</title>
  <desc>Layered reference cards with batch extraction badge symbolizing discovering and importing references in Zotero RefFlow.</desc>
  <defs>
    <linearGradient id="rfBackSheet" x1="44" y1="12" x2="108" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="rfMidSheet" x1="29" y1="24" x2="93" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="rfFrontSheet" x1="14" y1="36" x2="78" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="rfBadge" x1="72" y1="68" x2="114" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="55%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="rfLayerShadow" x="-18%" y="-18%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="3" stdDeviation="3.2" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
    <filter id="rfBadgeShadow" x="-22%" y="-22%" width="148%" height="148%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#881337" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Back Extracted Reference Card (Violet-Indigo) -->
  <rect x="44" y="12" width="64" height="76" rx="13" fill="url(#rfBackSheet)" />

  <!-- Middle Extracted Reference Card (Sky-Cyan) -->
  <g filter="url(#rfLayerShadow)">
    <rect x="29" y="24" width="64" height="78" rx="13" fill="url(#rfMidSheet)" />
  </g>

  <!-- Front Source Literature Card (Royal Cobalt) -->
  <g filter="url(#rfLayerShadow)">
    <rect x="14" y="36" width="64" height="80" rx="14" fill="url(#rfFrontSheet)" />
    <rect x="14.75" y="36.75" width="62.5" height="78.5" rx="13.25" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="1.5" />
    <rect x="26" y="57" width="38" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="26" y="73" width="27" height="8" rx="4" fill="#E0F2FE" fill-opacity="0.86" />
    <rect x="26" y="89" width="33" height="8" rx="4" fill="#E0F2FE" fill-opacity="0.72" />
  </g>

  <!-- Batch Extraction & Import Badge (Coral-Orange) -->
  <g filter="url(#rfBadgeShadow)">
    <circle cx="93" cy="91" r="24" fill="url(#rfBadge)" />
    <path d="M 82 91 H 102 M 94 82 L 103 91 L 94 100" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
